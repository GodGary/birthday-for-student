<html lang="zh-CN">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232997ff'/%3E%3Cstop offset='.5' stop-color='%23bf5af2'/%3E%3Cstop offset='1' stop-color='%23ff6ec7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E6%B7%BC%3C/text%3E%3C/svg%3E">
<style>
/* ================================================================
   液态玻璃设计令牌 — Liquid Glass Design Tokens
   ================================================================ */
:root {
  --bg: #000;
  --fg: #f5f5f7;
  --muted: #86868b;
  --blue: #2997ff;
  --accent: #bf5af2;
  --pink: #ff6ec7;
  --gold: #ffd60a;
  --glass-1: rgba(255,255,255,.025);
  --glass-2: rgba(255,255,255,.04);
  --glass-3: rgba(255,255,255,.07);
  --glass-4: rgba(255,255,255,.10);
  --glass-border: rgba(255,255,255,.10);
  --glass-border-bright: rgba(255,255,255,.18);
  --glass-blur: saturate(180%) blur(24px);
  --glass-blur-heavy: saturate(200%) blur(40px);
  --glass-blur-light: saturate(160%) blur(12px);
  --glass-highlight: rgba(255,255,255,.06);
  --glass-reflect: rgba(255,255,255,.25);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.2);
  --ease: cubic-bezier(.16,1,.3,1);
  --ease-out: cubic-bezier(0,.0,.2,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --dur-fast: .2s;
  --dur-normal: .4s;
  --dur-slow: .8s;
}

/* ================================================================
   基础重置 & 排版
   ================================================================ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
html { scroll-behavior:smooth; }
body {
  font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--fg); overflow-x:hidden; line-height:1.5;
  letter-spacing:-.01em; cursor:default;
  min-height:100vh;
}
::selection { background:var(--accent); color:#fff; }
::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-track { background:rgba(255,255,255,.02); }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.22); }

/* ================================================================
   背景层
   ================================================================ */
#starfield { position:fixed; inset:0; z-index:0; pointer-events:none; }
#glassParticles { position:fixed; inset:0; z-index:1; pointer-events:none; }
#confetti { position:fixed; inset:0; z-index:70; pointer-events:none; }
#rippleLayer { position:fixed; inset:0; z-index:80; pointer-events:none; }

/* ================================================================
   音乐开关 — 玻璃胶囊
   ================================================================ */
#musicBtn {
  position:fixed; top:16px; right:16px; z-index:60;
  width:46px; height:46px; border-radius:50%;
  background:rgba(0,0,0,.45);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  color:var(--fg); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all var(--dur-fast) var(--ease-out);
}
#musicBtn:hover { border-color:var(--glass-border-bright); background:var(--glass-3); transform:scale(1.05); }
#musicBtn .off { display:none; }
#musicBtn.muted { color:var(--muted); }
#musicBtn.muted .on { display:none; }
#musicBtn.muted .off { display:block; }
@media(max-width:600px){ #musicBtn { top:12px; right:12px; width:42px; height:42px; } }

/* ================================================================
   结尾 — 全屏许愿
   ================================================================ */
#finale {
  position:relative; z-index:2;
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  padding:60px 20px;
}
.cake {
  font-size:clamp(80px,18vw,150px); animation:float 5s ease-in-out infinite;
  cursor:pointer; filter:drop-shadow(0 20px 40px rgba(255,110,199,.4));
  user-select:none; transition:filter .3s;
}
.cake:hover { filter:drop-shadow(0 24px 50px rgba(255,110,199,.6)); }
@keyframes float {
  0%,100% { transform:translateY(0) rotate(0deg); }
  25% { transform:translateY(-16px) rotate(1deg); }
  75% { transform:translateY(-8px) rotate(-1deg); }
}
.finale-text {
  font-size:clamp(30px,6.5vw,72px); font-weight:800; margin-top:18px;
  background:linear-gradient(120deg,#fff,var(--pink),var(--accent),var(--blue));
  background-size:200% 200%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:gradientShift 6s ease infinite;
}
@keyframes gradientShift {
  0%,100% { background-position:0% 50%; }
  50% { background-position:100% 50%; }
}

/* 祝福卡 — 液态玻璃，点击蛋糕后出现 */
.wish-card {
  max-width:600px; width:100%; margin-top:34px;
  padding:36px 34px; border-radius:24px;
  background:var(--glass-2);
  backdrop-filter:var(--glass-blur-heavy);
  -webkit-backdrop-filter:var(--glass-blur-heavy);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  position:relative; overflow:hidden;
  opacity:0; transform:translateY(36px) scale(.96);
  pointer-events:none;
  transition:opacity .8s var(--ease),transform .8s var(--ease);
}
.wish-card::before {
  content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.06),transparent 65%);
}
.wish-card::after {
  content:""; position:absolute; top:0; left:8%; right:8%; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
}
.wish-card.show { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.wish-card p {
  font-size:clamp(16px,2.3vw,19px); line-height:2; color:#d5d5dc;
  text-align:left; position:relative; z-index:1; margin-bottom:14px;
}
.wish-card p:last-child { margin-bottom:0; }
.wish-card .hl { color:var(--pink); font-weight:600; }
.wish-card .hlb { color:var(--blue); font-weight:600; }
.wish-card .sign {
  text-align:right; color:var(--muted); font-size:clamp(13px,1.6vw,15px);
  margin-top:6px; position:relative; z-index:1;
}
.wish-card .sign b { color:var(--fg); font-weight:600; }
@media(max-width:600px){ .wish-card { padding:26px 22px; margin-top:26px; } }

.finale-hint {
  color:var(--muted); margin-top:22px; font-size:14px;
  transition:color var(--dur-normal);
}
.finale-hint.done { color:#c8b8ff; }

/* ================================================================
   液态波纹 — Ripple
   ================================================================ */
.ripple {
  position:absolute; border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.25),rgba(255,255,255,.05),transparent);
  transform:scale(0); animation:rippleOut 1s var(--ease-out) forwards;
  pointer-events:none;
}
@keyframes rippleOut { to { transform:scale(4); opacity:0; } }

footer {
  position:relative; z-index:2; text-align:center;
  padding:24px 20px 44px; color:var(--muted); font-size:13px;
}
footer .sig { color:var(--fg); font-weight:600; }
</style>
</head>
<body>

<!-- 背景层 -->
<canvas id="starfield"></canvas>
<canvas id="glassParticles"></canvas>
<canvas id="confetti"></canvas>
<canvas id="rippleLayer"></canvas>

<!-- 背景音乐：豆包演唱《祝你生日快乐》（标准音高） -->
<audio id="bdayAudio" src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/Ovhlbw8EpoOelex6xONcMWjCnaf" loop preload="none"></audio>

<!-- 音乐开关 -->
<button id="musicBtn" role="switch" aria-checked="true" aria-label="关闭背景音乐" title="背景音乐">
  <svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
</button>

<!-- ═══════════ 全屏许愿页 ═══════════ -->
<section id="finale">
  <div class="cake" id="cake">🎂</div>
  <div class="finale-text">生日快乐，王宸淼</div>

  <!-- 点完蛋糕出现的生日祝福 -->
  <div class="wish-card" id="wishCard">
    <p>宸淼，生日快乐。老师想对你说：<span class="hl">永远坚持自己的想法</span></p>
    <p>有想要的东西、有想见的人，就一定要努力去争取；<span class="hlb">好好学习，好好画画</span>，把日子过成自己喜欢的样子。</p>
    <p>祝你未来越来越好，天天开心😊</p>
    <div class="sign">—— 老师赠 · <b>王宸淼</b></div>
  </div>

  <div class="finale-hint" id="hint">点击蛋糕，许个愿吧 ✨</div>
</section>

<footer>
  用代码写下的生日祝福 · 献给 <span class="sig">王宸淼</span><br>
  愿你永远快乐
</footer>

<script>
/* ================================================================
   1. 星空 + 流星背景
   ================================================================ */
(function(){
  const cv=document.getElementById('starfield'), ctx=cv.getContext('2d');
  let W,H,stars=[],shooters=[];
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  resize(); addEventListener('resize',resize);
  const COUNT=Math.min(240,Math.floor(W*H/8000));
  const palette=['#ffffff','#9fd1ff','#d7b3ff','#ffc7e8','#a0d2ff'];
  for(let i=0;i<COUNT;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.8+.2,
      a:Math.random()*Math.PI*2, tw:Math.random()*.015+.003,
      vx:(Math.random()-.5)*.04, vy:(Math.random()-.5)*.04,
      c:palette[Math.floor(Math.random()*palette.length)],
      pulse:Math.random()>.7
    });
  }
  function spawnShooter(){
    if(Math.random()<.015&&shooters.length<4){
      shooters.push({
        x:Math.random()*W, y:-30,
        len:Math.random()*160+80, speed:Math.random()*8+6,
        angle:Math.PI/4+(Math.random()*.3-.15), life:1
      });
    }
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.a+=s.tw;
      let alpha=.3+Math.abs(Math.sin(s.a))*.7;
      if(s.pulse) alpha=.2+Math.abs(Math.sin(s.a*2.5))*.8;
      s.x+=s.vx; s.y+=s.vy;
      if(s.x<0)s.x=W; if(s.x>W)s.x=0;
      if(s.y<0)s.y=H; if(s.y>H)s.y=0;
      ctx.globalAlpha=alpha; ctx.fillStyle=s.c;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
      if(s.r>1.2&&alpha>.7){
        ctx.globalAlpha=alpha*.2;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r*2.5,0,7); ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    spawnShooter();
    for(let i=shooters.length-1;i>=0;i--){
      const m=shooters[i];
      m.x+=Math.cos(m.angle)*m.speed;
      m.y+=Math.sin(m.angle)*m.speed;
      m.life-=.007;
      const tx=m.x-Math.cos(m.angle)*m.len;
      const ty=m.y-Math.sin(m.angle)*m.len;
      const g=ctx.createLinearGradient(m.x,m.y,tx,ty);
      g.addColorStop(0,'rgba(255,255,255,'+Math.min(1,m.life*1.3)+')');
      g.addColorStop(.4,'rgba(200,220,255,'+Math.min(1,m.life*.5)+')');
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle=g; ctx.lineWidth=2.2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tx,ty); ctx.stroke();
      if(m.x>W+60||m.y>H+60||m.life<=0) shooters.splice(i,1);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

/* ================================================================
   2. 漂浮玻璃粒子
   ================================================================ */
(function(){
  const cv=document.getElementById('glassParticles'), ctx=cv.getContext('2d');
  let W,H,orbs=[];
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  resize(); addEventListener('resize',resize);
  const COUNT=16;
  for(let i=0;i<COUNT;i++){
    orbs.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*80+40,
      vx:(Math.random()-.5)*.15, vy:(Math.random()-.5)*.15,
      hue:Math.random()>.5?210:280,
      alpha:Math.random()*.03+.01,
      pulse:Math.random()*Math.PI*2
    });
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(const o of orbs){
      o.x+=o.vx; o.y+=o.vy;
      if(o.x<-100)o.x=W+100; if(o.x>W+100)o.x=-100;
      if(o.y<-100)o.y=H+100; if(o.y>H+100)o.y=-100;
      o.pulse+=.003;
      const a=o.alpha*(.7+.3*Math.sin(o.pulse));
      const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      g.addColorStop(0,'hsla('+o.hue+',80%,70%,'+a+')');
      g.addColorStop(.5,'hsla('+o.hue+',60%,60%,'+a*.5+')');
      g.addColorStop(1,'hsla('+o.hue+',40%,50%,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,7); ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

/* ================================================================
   3. 彩带 / 庆祝粒子系统
   ================================================================ */
const Confetti=(function(){
  const cv=document.getElementById('confetti'), ctx=cv.getContext('2d');
  let W,H,parts=[],active=false;
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  resize(); addEventListener('resize',resize);
  const colors=['#2997ff','#bf5af2','#ff6ec7','#ffd60a','#30d158','#ff9f0a','#ffffff',
                '#64d2ff','#ff8fb0','#a78bfa'];
  function burst(x,y,n){
    for(let i=0;i<n;i++){
      const ang=Math.random()*Math.PI*2, sp=Math.random()*9+3;
      parts.push({
        x,y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-3,
        g:.14, size:Math.random()*8+3, rot:Math.random()*Math.PI*2,
        vr:(Math.random()-.5)*.4, color:colors[Math.floor(Math.random()*colors.length)],
        life:1, decay:Math.random()*.007+.003,
        shape:['rect','circle','star'][Math.floor(Math.random()*3)]
      });
    }
    if(!active){ active=true; loop(); }
  }
  function rain(n){
    for(let i=0;i<n;i++){
      parts.push({
        x:Math.random()*W, y:-30,
        vx:(Math.random()-.5)*2.5, vy:Math.random()*4+2,
        g:.06, size:Math.random()*10+4, rot:Math.random()*Math.PI*2,
        vr:(Math.random()-.5)*.3, color:colors[Math.floor(Math.random()*colors.length)],
        life:1, decay:.0035,
        shape:['rect','circle','star'][Math.floor(Math.random()*3)]
      });
    }
    if(!active){ active=true; loop(); }
  }
  function drawStar(ctx,cx,cy,r){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=(i*4*Math.PI)/5-Math.PI/2;
      const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill();
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=p.decay;
      if(p.life<=0||p.y>H+40){ parts.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life);
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.color;
      if(p.shape==='rect'){ ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.55); }
      else if(p.shape==='star'){ drawStar(ctx,0,0,p.size/2); }
      else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,7); ctx.fill(); }
      ctx.restore();
      if(p.life>.6){
        ctx.save(); ctx.globalAlpha=p.life*.12;
        ctx.fillStyle=p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
        ctx.restore();
      }
    }
    if(parts.length>0) requestAnimationFrame(loop); else active=false;
  }
  return {burst,rain};
})();

/* ================================================================
   4. 蛋糕许愿 — 点完蛋糕出现生日祝福
   ================================================================ */
(function(){
  const cake=document.getElementById('cake');
  const wishCard=document.getElementById('wishCard');
  const hint=document.getElementById('hint');
  cake.addEventListener('click',()=>{
    const r=cake.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    Confetti.burst(cx,cy,140);
    Confetti.rain(90);
    spawnRipple(cx,cy,60);
    setTimeout(()=>spawnRipple(cx,cy,40),150);
    setTimeout(()=>spawnRipple(cx,cy,25),300);
    cake.animate([
      {transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(1)'}
    ],{duration:700,easing:'cubic-bezier(.34,1.56,.64,1)'});
    wishCard.classList.add('show');
    hint.classList.add('done');
    hint.textContent='愿望已经放进星河里了 ✨ 生日快乐，永远快乐';
  });
})();

/* ================================================================
   5. 全局液态波纹
   ================================================================ */
const rippleCv=document.getElementById('rippleLayer');
const rippleCtx=rippleCv.getContext('2d');
let rippleW, rippleH;
const ripples=[];
function resizeRipple(){ rippleW=rippleCv.width=innerWidth; rippleH=rippleCv.height=innerHeight; }
resizeRipple(); addEventListener('resize',resizeRipple);

function spawnRipple(x,y,maxR){
  ripples.push({x,y,r:0,maxR:maxR||50,life:1,speed:1.8});
  if(ripples.length===1) rippleLoop();
}
function rippleLoop(){
  rippleCtx.clearRect(0,0,rippleW,rippleH);
  for(let i=ripples.length-1;i>=0;i--){
    const rp=ripples[i];
    rp.r+=rp.speed; rp.life-=.018;
    if(rp.life<=0){ ripples.splice(i,1); continue; }
    const alpha=rp.life*.15;
    const g=rippleCtx.createRadialGradient(rp.x,rp.y,rp.r*.3,rp.x,rp.y,rp.r);
    g.addColorStop(0,'rgba(255,255,255,'+alpha+')');
    g.addColorStop(.5,'rgba(255,255,255,'+alpha*.5+')');
    g.addColorStop(1,'rgba(255,255,255,0)');
    rippleCtx.strokeStyle=g; rippleCtx.lineWidth=1.5;
    rippleCtx.beginPath(); rippleCtx.arc(rp.x,rp.y,rp.r,0,7); rippleCtx.stroke();
  }
  if(ripples.length>0) requestAnimationFrame(rippleLoop);
}
document.addEventListener('click',e=>{
  if(e.target.closest('button')) return;
  spawnRipple(e.clientX,e.clientY,35);
});

/* ================================================================
   6. 载入庆祝
   ================================================================ */
window.addEventListener('load',()=>{
  setTimeout(()=>Confetti.rain(60),1200);
});

/* ================================================================
   7. 背景音乐 — 纯钢琴版生日快乐歌
   ================================================================ */
(function(){
  const audio=document.getElementById('bdayAudio');
  const btn=document.getElementById('musicBtn');
  let on=true;
  try{ on=localStorage.getItem('chenmiaoMusic')!=='0'; }catch(e){}
  audio.volume=0.45;
  audio.muted=!on;
  btn.classList.toggle('muted',!on);
  btn.setAttribute('aria-checked',on?'true':'false');
  btn.setAttribute('aria-label',on?'关闭背景音乐':'开启背景音乐');
  function play(){
    audio.muted=false;
    const p=audio.play();
    if(p&&p.catch) p.catch(function(){});
  }
  btn.addEventListener('click',()=>{
    on=!on;
    try{ localStorage.setItem('chenmiaoMusic',on?'1':'0'); }catch(e){}
    btn.classList.toggle('muted',!on);
    btn.setAttribute('aria-checked',on?'true':'false');
    btn.setAttribute('aria-label',on?'关闭背景音乐':'开启背景音乐');
    if(on) play(); else audio.pause();
  });
  const tryStart=()=>{ if(on&&audio.paused){ play(); } };
